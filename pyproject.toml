[project]
name = "portfolio-terminal"
version = "0.1.0"
description = "An SSH-accessible terminal portfolio, served as a TUI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.18",
    "textual>=0.85",
]

[project.scripts]
portfolio-ssh = "portfolio.server:main"
portfolio-tui = "portfolio.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]
